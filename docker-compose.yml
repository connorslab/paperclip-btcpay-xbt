services:
  web:
    image: xbtpay-server:beta
    user: "1000:1000"
    entrypoint: ["dotnet", "BTCPayServer.dll"]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_started}
      nbxplorer: {condition: service_started}
      # Only with the CLN backend (profile "cln"); LND needs no gateway.
      gateway: {condition: service_started, required: false}
    ports: ["127.0.0.1:23000:3003"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      HOME: /data
      BTCPAY_DATADIR: /data
      BTCPAY_PLUGINDIR: /data/plugins
      BTCPAY_DOCKERDEPLOYMENT: "false"
      BTCPAY_NETWORK: mainnet
      BTCPAY_CHAINS: XBT
      BTCPAY_BIND: 0.0.0.0:3003
      # CLN through the invoice-only gateway by default; or an LND connection string
      # from scripts/lnd-connection.sh (invoice-only macaroon, pinned TLS thumbprint).
      BTCPAY_XBTLIGHTNING: "${XBT_LIGHTNING:-type=clightning;server=unix:/gateway/lightning-rpc}"
      # Optional: your own XBT payment icon (QR centre and checkout), a path under the
      # web root (e.g. a mounted file) or an https URL. Empty keeps the default.
      BTCPAY_XBTICON: "${XBT_ICON:-}"
      # Optional: the label next to XBTSATS amounts (default "XBT sats").
      BTCPAY_XBTSATSLABEL: "${XBT_SATS_LABEL:-}"
      BTCPAY_XBTEXPLORERURL: http://nbxplorer:24444
      BTCPAY_XBTEXPLORERCOOKIEFILE: /nbxplorer/Main/.cookie
      BTCPAY_POSTGRES: "User ID=postgres;Host=postgres;Database=btcpay;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - ./data/btcpay:/data
      - ./data/nbxplorer:/nbxplorer:ro
      - gateway-rpc:/gateway:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  nbxplorer:
    image: xbtpay-nbxplorer:beta
    user: "1000:1000"
    restart: unless-stopped
    depends_on: [postgres]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      HOME: /data
      NBXPLORER_DATADIR: /data
      NBXPLORER_NETWORK: mainnet
      NBXPLORER_CHAINS: XBT
      NBXPLORER_BIND: 0.0.0.0:24444
      NBXPLORER_XBTRPCURL: "${XBT_RPC_URL:?Set XBT_RPC_URL}"
      NBXPLORER_XBTRPCUSER: "${XBT_RPC_USER:?Set XBT_RPC_USER}"
      NBXPLORER_XBTRPCPASSWORD: "${XBT_RPC_PASSWORD:?Set XBT_RPC_PASSWORD}"
      NBXPLORER_XBTNODEENDPOINT: "${XBT_P2P_ENDPOINT:?Set XBT_P2P_ENDPOINT}"
      NBXPLORER_EXPOSERPC: "false"
      NBXPLORER_POSTGRES: "User ID=postgres;Host=postgres;Database=nbxplorer;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes: ["./data/nbxplorer:/data"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  gateway:
    image: xbtpay-cln-gateway:beta
    profiles: [cln]
    user: "1000:1000"
    group_add: ["${CLN_RPC_GID:-1000}"]
    restart: unless-stopped
    environment:
      # Defaults keep `docker compose config` working when the cln profile is off;
      # the gateway itself refuses to start without a valid node id.
      EXPECTED_NODE: "${CLN_NODE_ID:-}"
      CLN_ADVERTISE_HOST: "${CLN_ADVERTISE_HOST:-}"
      CLN_ADVERTISE_PORT: "${CLN_ADVERTISE_PORT:-9735}"
    volumes:
      - type: bind
        source: "${CLN_SOCKET:-/run/cln-socket-not-configured}"
        target: /cln/lightning-rpc
        read_only: true
        bind:
          create_host_path: false
      - gateway-rpc:/gateway
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: btcpay
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./deploy/10-nbxplorer.sql:/docker-entrypoint-initdb.d/10-nbxplorer.sql:ro
volumes:
  gateway-rpc:
